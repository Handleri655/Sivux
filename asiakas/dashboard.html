<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#07080c" />
  <title>Dashboard | Sivux-asiakasportaali</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body class="portal-body">
  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <div class="portal-brand portal-brand--compact">
        <img src="../favicon.svg" alt="" width="28" height="28" />
        <div>
          <p class="portal-kicker">Sivux-asiakasportaali</p>
          <p class="portal-client-name" id="client-name">…</p>
        </div>
      </div>
      <div class="portal-topbar-actions">
        <a class="btn btn-ghost" id="site-link" href="#" target="_blank" rel="noopener noreferrer">Avaa sivusto</a>
        <button type="button" class="btn btn-ghost" id="logout-btn">Kirjaudu ulos</button>
      </div>
    </div>
  </header>

  <main class="portal-main">
    <div class="portal-toolbar">
      <div>
        <h1>Kävijätiedot</h1>
        <p class="portal-lead" id="range-label">Viimeiset 7 päivää</p>
      </div>
      <div class="portal-range" role="group" aria-label="Aikaväli">
        <button type="button" class="portal-chip is-active" data-range="7">7 pv</button>
        <button type="button" class="portal-chip" data-range="30">30 pv</button>
        <button type="button" class="portal-chip" data-range="90">90 pv</button>
      </div>
    </div>

    <p class="portal-status" id="dash-status" hidden></p>

    <section class="portal-stats" id="stats-grid">
      <article class="portal-stat">
        <p class="portal-stat-label">Kävijät</p>
        <p class="portal-stat-value" id="stat-visitors">—</p>
      </article>
      <article class="portal-stat">
        <p class="portal-stat-label">Sivun katselut</p>
        <p class="portal-stat-value" id="stat-pageviews">—</p>
      </article>
      <article class="portal-stat">
        <p class="portal-stat-label">Domain</p>
        <p class="portal-stat-value portal-stat-value--small" id="stat-domain">—</p>
      </article>
    </section>

    <section class="portal-panels">
      <article class="portal-panel">
        <h2>Päivittäinen liikenne</h2>
        <div class="portal-chart" id="daily-chart" aria-live="polite"></div>
      </article>
      <article class="portal-panel">
        <h2>Suosituimmat sivut</h2>
        <div class="portal-table" id="top-routes"></div>
      </article>
      <article class="portal-panel">
        <h2>Liikenteen lähteet</h2>
        <div class="portal-table" id="referrers"></div>
      </article>
      <article class="portal-panel">
        <h2>Laitteet</h2>
        <div class="portal-table" id="devices"></div>
      </article>
    </section>
  </main>

  <script src="portal.js"></script>
</body>
</html>
