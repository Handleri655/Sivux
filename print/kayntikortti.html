<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <title>Sivux käyntikortti 88×56 mm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* 8.8 cm × 5.6 cm @ 300 DPI = 1039 × 661 px */
    :root {
      --w: 1039px;
      --h: 661px;
      --bg: #07070d;
      --text: #f2f4ff;
      --muted: #9aa1b8;
      --accent: #8af3ff;
      --accent-3: #73ffca;
      --safe: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a1b22;
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 36px;
      min-height: 100vh;
    }

    .label {
      color: #8b90a0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: #07070d;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      box-shadow: none;
      border: none;
      outline: none;
      flex-shrink: 0;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 80% at 8% 0%, rgba(138, 243, 255, 0.16), transparent 55%),
        radial-gradient(ellipse 55% 70% at 100% 10%, rgba(187, 155, 255, 0.2), transparent 50%),
        radial-gradient(ellipse 50% 45% at 85% 100%, rgba(115, 255, 202, 0.12), transparent 55%),
        linear-gradient(155deg, #10131f 0%, #080910 42%, #05060a 100%);
    }

    .card-grid {
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(120deg, rgba(0, 0, 0, 0.85), transparent 70%);
    }

    .card-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .card-orb-a {
      width: 280px;
      height: 280px;
      right: -60px;
      top: -90px;
      background: radial-gradient(circle, rgba(187, 155, 255, 0.28), transparent 68%);
    }

    .card-orb-b {
      width: 220px;
      height: 220px;
      left: -70px;
      bottom: -80px;
      background: radial-gradient(circle, rgba(115, 255, 202, 0.18), transparent 70%);
    }

    .card-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        transparent 35%,
        rgba(255, 255, 255, 0.035) 48%,
        transparent 62%
      );
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: var(--safe);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .brand {
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 800;
      font-size: 108px;
      letter-spacing: -0.06em;
      line-height: 0.92;
      color: var(--text);
      text-shadow: 0 0 40px rgba(138, 243, 255, 0.12);
    }

    .brand span {
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 16px;
      font-size: 23px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
      max-width: 16ch;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 24px;
      position: relative;
    }

    .meta::before {
      content: "";
      position: absolute;
      left: 0;
      top: -1px;
      width: 72px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .contacts {
      display: grid;
      gap: 8px;
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }

    .contacts .muted {
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .domain-wrap {
      text-align: right;
    }

    .domain {
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--accent), #b8fff0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .domain-note {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }

    /* Back */
    .card--back .card-inner {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
    }

    .card--back .kicker {
      margin-bottom: 20px;
    }

    .card--back .tagline {
      margin-top: 22px;
      max-width: none;
      font-size: 24px;
      color: #c5cad9;
    }

    .card--back .pill {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid rgba(138, 243, 255, 0.28);
      background: linear-gradient(
        135deg,
        rgba(138, 243, 255, 0.1),
        rgba(115, 255, 202, 0.06)
      );
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .card--back .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      box-shadow: 0 0 12px rgba(138, 243, 255, 0.7);
    }
  </style>
</head>
<body>
  <p class="label">Etupuoli · 88 × 56 mm · 300 DPI</p>
  <div class="card" id="card-front">
    <div class="card-bg"></div>
    <div class="card-grid"></div>
    <div class="card-orb card-orb-a"></div>
    <div class="card-orb card-orb-b"></div>
    <div class="card-shine"></div>
    <div class="card-inner">
      <div>
        <p class="kicker">Web studio</p>
        <div class="brand">Sivux<span>.</span></div>
        <p class="tagline">Nettisivut yrityksille</p>
      </div>
      <div class="meta">
        <div class="contacts">
          <div>info@sivux.fi</div>
          <div>+358 44 021 1209</div>
          <div class="muted">Y-tunnus 3616701-3</div>
        </div>
        <div class="domain-wrap">
          <div class="domain">sivux.fi</div>
          <div class="domain-note">sivux.fi/sivustoanalyysi</div>
        </div>
      </div>
    </div>
  </div>

  <p class="label">Takapuoli · 88 × 56 mm · 300 DPI</p>
  <div class="card card--back" id="card-back">
    <div class="card-bg"></div>
    <div class="card-grid"></div>
    <div class="card-orb card-orb-a"></div>
    <div class="card-orb card-orb-b"></div>
    <div class="card-shine"></div>
    <div class="card-inner">
      <div>
        <div class="brand">Sivux<span>.</span></div>
        <p class="tagline">Modernit verkkosivut kasvua varten.</p>
        <div class="pill">
          <span class="pill-dot"></span>
          Ilmainen nettisivuanalyysi
        </div>
      </div>
    </div>
  </div>
</body>
</html>
